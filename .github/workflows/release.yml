name: Release

# Publishes a GitHub release whenever the VERSION file changes on main (or on demand).
# The release is tagged v<version>; a version that already has a release is skipped.
# The release holds the Windows installer and zip, and the Android app (RConnect-<version>-android.apk).
# The in-app update checker reads the latest release and its RConnect-<version>-setup.exe asset.
#
# Optional signing (without the secrets the builds are unsigned, and the APK is signed with a debug key):
#   Windows: SIGN_PFX_BASE64 (base64 of the .pfx) and SIGN_PFX_PASSWORD.
#   Android: ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
#   ANDROID_KEY_PASSWORD. Keep using the same keystore, or phones cannot update the app in place.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # aqtinstall cannot install Qt 6.11 yet (miurahr/aqtinstall#1007), so CI builds with the last release it can.
  QT_VERSION: 6.10.3
  QT_FALLBACK_VERSION: 6.10.2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must hold major.minor.patch, found '$v'" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$v already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The default package list includes "tools", which the current cmdline-tools no longer ship.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No Android keystore configured; the APK is signed with a debug key."
          fi

      - name: Build
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "RConnect-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: RConnect-*-android.apk
          if-no-files-found: error

  windows:
    needs: [version, android]
    # The Windows release goes out even if the Android build failed.
    if: ${{ always() && needs.version.outputs.exists == 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Qt download mirror sometimes fails for one version; the second step then tries the one before it.
      - name: Install Qt
        id: qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtactiveqt
          cache: true

      - name: Install Qt (fallback)
        if: steps.qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_FALLBACK_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtactiveqt
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found." }

      - name: Country data
        run: python tools/update_geodata.py

      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            "SKIP_SIGN=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "No signing certificate configured; building unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
                      -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx
          $cn = ($cert.Subject -split ',' | Where-Object { $_.Trim() -like 'CN=*' } | Select-Object -First 1).Trim().Substring(3)
          "SIGN_CN=$cn" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        shell: cmd
        env:
          KEEP_VERSION: "1"
        run: |
          set "QT_DIR=%QT_ROOT_DIR%"
          call build-release.bat

      - name: Android app
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\RConnect-*-win64.zip, dist\RConnect-*-setup.exe, dist\RConnect-*-android.apk -ErrorAction SilentlyContinue |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          files=("dist/RConnect-$VERSION-setup.exe" "dist/RConnect-$VERSION-win64.zip" dist/SHA256SUMS.txt)
          [ -f "dist/RConnect-$VERSION-android.apk" ] && files+=("dist/RConnect-$VERSION-android.apk")
          gh release create "v$VERSION" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "RConnect v$VERSION" \
            --generate-notes
